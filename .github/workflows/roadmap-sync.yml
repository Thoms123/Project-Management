name: Roadmap Sync

# Mengubah .github/roadmap.yml menjadi Epic Issue + Task sub-issue + Project board.
#
# Sengaja HANYA manual: menjalankannya membuat puluhan Issue sekaligus, jadi
# tidak pantas terpicu otomatis oleh push. Default `dry_run: true` memastikan
# klik pertama tidak pernah mengubah apa pun.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Hanya tampilkan rencana, jangan buat apa pun"
        type: boolean
        default: true
      phase:
        description: "Fase yang disinkronkan (jalankan satu per satu untuk menghindari rate limit)"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "4"
          - "all"
        default: "1"
      skip_project_board:
        description: "Lewati Project board, hanya buat Issue"
        type: boolean
        default: false

permissions:
  issues: write
  contents: read

# Dua run bersamaan bisa saling mendahului saat memindai Issue yang sudah ada
# dan berakhir membuat duplikat. Antrikan, jangan batalkan yang sedang jalan.
concurrency:
  group: roadmap-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sinkronkan roadmap
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: .github/scripts/package-lock.json

      - name: Pasang dependency
        working-directory: .github/scripts
        run: npm ci

      - name: Validasi manifest
        working-directory: .github/scripts
        run: node sync-roadmap.mjs --validate-only

      - name: Jalankan sinkronisasi
        working-directory: .github/scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITHUB_TOKEN tidak punya akses Projects v2. Bila secret ini kosong,
          # script melewati bagian board dengan peringatan dan Issue tetap dibuat.
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          args="--phase=${{ inputs.phase }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args="$args --dry-run"
          fi
          if [ "${{ inputs.skip_project_board }}" = "true" ]; then
            args="$args --skip-project-board"
          fi
          echo "Menjalankan: node sync-roadmap.mjs $args"
          node sync-roadmap.mjs $args
